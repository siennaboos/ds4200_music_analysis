<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Average Liveness by Genre Category</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    body {
      font-family: 'Circular', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      background-color: #121212;
      padding: 20px;
    }
    .container {
      background: #121212;
      padding: 30px;
      border-radius: 8px;
      max-width: 1200px;
      width: 100%;
    }
    canvas {
      max-width: 100%;
    }
  </style>
</head>
<body>
  <div class="container">
    <canvas id="livenessChart"></canvas>
  </div>

  <script>
    const genre_dict = {
      'Rock & Alternative': [
        'alt-rock', 'alternative', 'grunge', 'hard-rock', 'indie',
        'psych-rock', 'punk-rock', 'punk', 'rock', 'rock-n-roll',
        'guitar', 'goth', 'emo', 'garage', 'industrial', 'grindcore',
        'hardcore'
      ],
      'Metal': [
        'black-metal', 'death-metal', 'heavy-metal', 'metal',
        'metalcore', 'power-pop'
      ],
      'Electronic & Dance': [
        'breakbeat', 'chicago-house', 'club', 'dance', 'deep-house',
        'detroit-techno', 'disco', 'drum-and-bass', 'dubstep', 'edm',
        'electro', 'electronic', 'hardstyle', 'house', 'idm',
        'minimal-techno', 'progressive-house', 'techno', 'trance',
        'synth-pop', 'groove'
      ],
      'Hip-Hop & Urban': [
        'hip-hop', 'r-n-b', 'soul', 'funk', 'dub', 'trip-hop'
      ],
      'Pop': [
        'pop', 'indie-pop', 'pop-film', 'party'
      ],
      'Country & Folk Americana': [
        'country', 'folk', 'bluegrass', 'honky-tonk',
        'singer-songwriter', 'songwriter', 'acoustic'
      ],
      'Jazz & Blues': [
        'jazz', 'blues', 'gospel'
      ],
      'Latin & Caribbean': [
        'latin', 'latino', 'reggae', 'reggaeton', 'dancehall',
        'salsa', 'samba', 'tango', 'brazil', 'forro', 'pagode'
      ],
      'Brazilian': [
        'mpb', 'sertanejo'
      ],
      'Asian Pop & Regional': [
        'j-pop', 'j-rock', 'j-dance', 'j-idol', 'k-pop',
        'cantopop', 'mandopop', 'indian', 'malay'
      ],
      'European & Regional': [
        'french', 'german', 'british', 'swedish', 'turkish',
        'iranian', 'spanish'
      ],
      'Classical & Sophisticated': [
        'classical', 'opera', 'new-age', 'piano'
      ],
      'Mood & Ambient': [
        'ambient', 'chill', 'happy', 'sad', 'sleep', 'study'
      ],
      'World & Traditional': [
        'world-music', 'afrobeat', 'ska'
      ],
      'Specialty & Novelty': [
        'anime', 'children', 'kids', 'comedy', 'disney',
        'show-tunes', 'romance', 'rockabilly'
      ]
    };

    // Load and process data
    fetch('dataset.csv')
      .then(response => response.text())
      .then(csvText => {
        const rows = csvText.split('\n');
        const headers = rows[0].split(',');
        const genreIndex = headers.indexOf('track_genre');
        const livenessIndex = headers.indexOf('liveness');

        // Create genre to category mapping
        const genreToCategory = {};
        for (const [category, genres] of Object.entries(genre_dict)) {
          genres.forEach(genre => {
            genreToCategory[genre] = category;
          });
        }

        // Calculate average liveness by category
        const categoryData = {};
        const categoryCounts = {};

        for (let i = 1; i < rows.length; i++) {
          if (!rows[i].trim()) continue;
          const cols = rows[i].split(',');
          const genre = cols[genreIndex];
          const liveness = parseFloat(cols[livenessIndex]);

          if (!genre || isNaN(liveness)) continue;

          const category = genreToCategory[genre];
          if (!category) continue;

          if (!categoryData[category]) {
            categoryData[category] = 0;
            categoryCounts[category] = 0;
          }

          categoryData[category] += liveness;
          categoryCounts[category] += 1;
        }

        // Create data arrays
        const categories = [];
        const avgLiveness = [];
        
        for (const [category, total] of Object.entries(categoryData)) {
          categories.push(category);
          avgLiveness.push(total / categoryCounts[category]);
        }

        // Sort by liveness descending
        const sortedData = categories.map((cat, i) => ({
          category: cat,
          liveness: avgLiveness[i]
        })).sort((a, b) => b.liveness - a.liveness);

        const sortedCategories = sortedData.map(d => d.category);
        const sortedLiveness = sortedData.map(d => d.liveness);

        // Generate green colors from light to dark based on value
        const greenColors = sortedLiveness.map(value => {
          // Normalize value between 0 and 1
          const normalized = (value - Math.min(...sortedLiveness)) / 
                           (Math.max(...sortedLiveness) - Math.min(...sortedLiveness));
          
          // Green gradient from light to dark
          const greens = [
            '#90EE90', // Light Green
            '#4CBB17', // Kelly Green
            '#32CD32', // Lime Green
            '#2AAA8A', // Jungle Green
            '#00A36C', // Jade
            '#355E3B', // Hunter Green
            '#008000'  // Green
          ];
          
          // Pick color based on normalized value
          const index = Math.floor(normalized * (greens.length - 1));
          return greens[index];
        });

        // Create chart
        const ctx = document.getElementById('livenessChart').getContext('2d');
        new Chart(ctx, {
          type: 'bar',
          data: {
            labels: sortedCategories,
            datasets: [{
              label: 'Average Liveness',
              data: sortedLiveness,
              backgroundColor: greenColors,
              borderColor: greenColors,
              borderWidth: 1
            }]
          },
          options: {
            indexAxis: 'y',
            responsive: true,
            maintainAspectRatio: true,
            plugins: {
              title: {
                display: true,
                text: 'Average Liveness by Genre Category',
                font: {
                  size: 18,
                  weight: '700'
                },
                color: '#ffffff'
              },
              legend: {
                display: false
              },
              tooltip: {
                callbacks: {
                  label: function(context) {
                    return 'Average Liveness: ' + context.parsed.x.toFixed(4);
                  }
                }
              }
            },
            scales: {
              x: {
                title: {
                  display: true,
                  text: 'Average Liveness Score',
                  color: '#ffffff'
                },
                beginAtZero: true,
                max: 0.45,
                ticks: {
                  color: '#b3b3b3'
                },
                grid: {
                  color: '#282828'
                }
              },
              y: {
                title: {
                  display: true,
                  text: 'Genre Category',
                  color: '#ffffff'
                },
                ticks: {
                  color: '#b3b3b3'
                },
                grid: {
                  color: '#282828'
                }
              }
            }
          }
        });
      })
      .catch(error => {
        console.error('Error loading data:', error);
      });
  </script>
</body>
</html>
