<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Liveness Distribution by Genre Category</title>
  <script src="https://cdn.jsdelivr.net/npm/vega@5"></script>
  <script src="https://cdn.jsdelivr.net/npm/vega-lite@5"></script>
  <script src="https://cdn.jsdelivr.net/npm/vega-embed@6"></script>
  <style>
    body {
      font-family: 'Circular', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      margin: 0;
      padding: 20px;
      background-color: #121212;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    #vis {
      background: #121212;
      padding: 20px;
      border-radius: 8px;
      display: inline-block;
    }
  </style>
</head>
<body>
  <div id="vis"></div>

  <script type="text/javascript">
    const genre_dict = {
      'Rock & Alternative': [
        'alt-rock', 'alternative', 'grunge', 'hard-rock', 'indie',
        'psych-rock', 'punk-rock', 'punk', 'rock', 'rock-n-roll',
        'guitar', 'goth', 'emo', 'garage', 'industrial', 'grindcore',
        'hardcore'
      ],
      'Metal': [
        'black-metal', 'death-metal', 'heavy-metal', 'metal',
        'metalcore', 'power-pop'
      ],
      'Electronic & Dance': [
        'breakbeat', 'chicago-house', 'club', 'dance', 'deep-house',
        'detroit-techno', 'disco', 'drum-and-bass', 'dubstep', 'edm',
        'electro', 'electronic', 'hardstyle', 'house', 'idm',
        'minimal-techno', 'progressive-house', 'techno', 'trance',
        'synth-pop', 'groove'
      ],
      'Hip-Hop & Urban': [
        'hip-hop', 'r-n-b', 'soul', 'funk', 'dub', 'trip-hop'
      ],
      'Pop': [
        'pop', 'indie-pop', 'pop-film', 'party'
      ],
      'Country & Folk Americana': [
        'country', 'folk', 'bluegrass', 'honky-tonk',
        'singer-songwriter', 'songwriter', 'acoustic'
      ],
      'Jazz & Blues': [
        'jazz', 'blues', 'gospel'
      ],
      'Latin & Caribbean': [
        'latin', 'latino', 'reggae', 'reggaeton', 'dancehall',
        'salsa', 'samba', 'tango', 'brazil', 'forro', 'pagode'
      ],
      'Brazilian': [
        'mpb', 'sertanejo'
      ],
      'Asian Pop & Regional': [
        'j-pop', 'j-rock', 'j-dance', 'j-idol', 'k-pop',
        'cantopop', 'mandopop', 'indian', 'malay'
      ],
      'European & Regional': [
        'french', 'german', 'british', 'swedish', 'turkish',
        'iranian', 'spanish'
      ],
      'Classical & Sophisticated': [
        'classical', 'opera', 'new-age', 'piano'
      ],
      'Mood & Ambient': [
        'ambient', 'chill', 'happy', 'sad', 'sleep', 'study'
      ],
      'World & Traditional': [
        'world-music', 'afrobeat', 'ska'
      ],
      'Specialty & Novelty': [
        'anime', 'children', 'kids', 'comedy', 'disney',
        'show-tunes', 'romance', 'rockabilly'
      ]
    };

    // Load and process data
    fetch('dataset.csv')
      .then(response => response.text())
      .then(csvText => {
        const rows = csvText.split('\n');
        const headers = rows[0].split(',');
        const genreIndex = headers.indexOf('track_genre');
        const livenessIndex = headers.indexOf('liveness');

        // Create genre to category mapping
        const genreToCategory = {};
        for (const [category, genres] of Object.entries(genre_dict)) {
          genres.forEach(genre => {
            genreToCategory[genre] = category;
          });
        }

        // Collect all data points with their categories
        const data = [];

        for (let i = 1; i < rows.length; i++) {
          if (!rows[i].trim()) continue;
          const cols = rows[i].split(',');
          const genre = cols[genreIndex];
          const liveness = parseFloat(cols[livenessIndex]);

          if (!genre || isNaN(liveness)) continue;

          const category = genreToCategory[genre];
          if (!category) continue;

          data.push({
            genre_category: category,
            liveness: liveness
          });
        }

        // Calculate median for sorting
        const categoryMedians = {};
        const categoryData = {};
        
        data.forEach(d => {
          if (!categoryData[d.genre_category]) {
            categoryData[d.genre_category] = [];
          }
          categoryData[d.genre_category].push(d.liveness);
        });

        Object.keys(categoryData).forEach(cat => {
          const sorted = categoryData[cat].sort((a, b) => a - b);
          const mid = Math.floor(sorted.length / 2);
          categoryMedians[cat] = sorted.length % 2 ? sorted[mid] : (sorted[mid - 1] + sorted[mid]) / 2;
        });

        // Sort categories by median
        const sortedCategories = Object.keys(categoryMedians)
          .sort((a, b) => categoryMedians[b] - categoryMedians[a]);

        // Create Vega-Lite specification
        const spec = {
          "$schema": "https://vega.github.io/schema/vega-lite/v5.json",
          "data": {"values": data},
          "width": 800,
          "height": 500,
          "background": "#121212",
          "title": {
            "text": "Liveness Distribution by Genre Category",
            "color": "#ffffff",
            "fontSize": 18,
            "font": "Circular, -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif",
            "fontWeight": 700
          },
          "mark": {
            "type": "boxplot",
            "extent": "min-max",
            "size": 25,
            "outliers": false
          },
          "encoding": {
            "y": {
              "field": "genre_category",
              "type": "nominal",
              "title": "Genre Category",
              "sort": sortedCategories,
              "axis": {
                "titleColor": "#ffffff",
                "labelColor": "#b3b3b3",
                "gridColor": "#282828",
                "domainColor": "#282828"
              }
            },
            "x": {
              "field": "liveness",
              "type": "quantitative",
              "title": "Liveness Score",
              "scale": {"domain": [0, 1]},
              "axis": {
                "titleColor": "#ffffff",
                "labelColor": "#b3b3b3",
                "gridColor": "#282828",
                "domainColor": "#282828"
              }
            },
            "color": {
              "field": "genre_category",
              "type": "nominal",
              "scale": {
                "domain": sortedCategories,
                "range": ["#008000", "#355E3B", "#00A36C", "#2AAA8A", "#32CD32", "#4CBB17", "#90EE90", 
                         "#008000", "#355E3B", "#00A36C", "#2AAA8A", "#32CD32", "#4CBB17", "#90EE90"]
              },
              "legend": null
            }
          },
          "config": {
            "background": "#121212",
            "view": {
              "stroke": "transparent",
              "fill": "#121212"
            },
            "axis": {
              "grid": true,
              "gridColor": "#282828"
            },
            "legend": {
              "fillColor": "#121212",
              "strokeColor": "#282828",
              "titleColor": "#ffffff",
              "labelColor": "#ffffff"
            },
            "boxplot": {
              "box": {
                "fill": "#1DB954"
              },
              "median": {
                "color": "#ffffff",
                "size": 2
              }
            }
          }
        };

        vegaEmbed('#vis', spec, {
          actions: false,
          renderer: 'canvas'
        });
      })
      .catch(error => {
        console.error('Error loading data:', error);
        document.getElementById('vis').innerHTML = '<p style="color: #ffffff;">Error loading dataset.csv</p>';
      });
  </script>
</body>
</html>
