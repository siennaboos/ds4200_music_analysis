<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Popularity by Artists (Top 20), Split by Explicit Hue</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        body {
            font-family: 'Circular', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #121212;
            padding: 20px;
        }
        .container {
            background: #121212;
            padding: 30px;
            border-radius: 8px;
            max-width: 1200px;
            width: 100%;
        }
        canvas {
            max-width: 100%;
        }
    </style>
</head>
<body>
    <div class="container">
        <canvas id="popularityChart"></canvas>
    </div>

    <script>
        const ctx = document.getElementById('popularityChart').getContext('2d');
        
        const artists = [
            'Pepper', 'Yung Nut', 'Tank', 'Herald', 'Berry', 'Beatles', 
            'Airport', 'Coder', 'Leaf', 'Borders', 'Myers', 'Lisrom', 
            'Kantees', 'Jones', 'BTS', 'Faid', 'Blue', 'Dablys', 'Raslers', 'Adams'
        ];

        const explicitFalse = [42, 43, 57, 0, 8, 61, 33, 25, 46, 0, 55, 0, 13, 17, 69, 10, 31, 7, 55, 11];
        const explicitTrue = [37, 0, 50, 0, 0, 0, 30, 25, 0, 0, 60, 32, 71, 0, 0, 12, 20, 0, 0, 0];

        new Chart(ctx, {
            type: 'bar',
            data: {
                labels: artists,
                datasets: [
                    {
                        label: 'False',
                        data: explicitFalse,
                        backgroundColor: '#1DB954',
                        borderColor: '#1DB954',
                        borderWidth: 1
                    },
                    {
                        label: 'True',
                        data: explicitTrue,
                        backgroundColor: '#1ed760',
                        borderColor: '#1ed760',
                        borderWidth: 1
                    }
                ]
            },
            options: {
                responsive: true,
                maintainAspectRatio: true,
                plugins: {
                    title: {
                        display: true,
                        text: 'Popularity by Artists (Top 20), Split by Explicit Content',
                        font: {
                            size: 18,
                            weight: '700'
                        },
                        color: '#ffffff'
                    },
                    legend: {
                        display: true,
                        position: 'top',
                        align: 'end',
                        title: {
                            display: true,
                            text: 'explicit',
                            color: '#ffffff'
                        },
                        labels: {
                            color: '#ffffff'
                        }
                    }
                },
                scales: {
                    x: {
                        title: {
                            display: false
                        },
                        ticks: {
                            maxRotation: 90,
                            minRotation: 90,
                            color: '#b3b3b3'
                        },
                        grid: {
                            color: '#282828'
                        }
                    },
                    y: {
                        title: {
                            display: true,
                            text: 'popularity',
                            color: '#ffffff'
                        },
                        beginAtZero: true,
                        max: 75,
                        ticks: {
                            color: '#b3b3b3'
                        },
                        grid: {
                            color: '#282828'
                        }
                    }
                }
            }
        });
    </script>
</body>
</html>
