<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Popularity by Artists (Top 20), Split by Explicit Content</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        body {
            font-family: 'Circular', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #121212;
            padding: 20px;
        }
        .container {
            background: #121212;
            padding: 30px;
            border-radius: 8px;
            max-width: 1200px;
            width: 100%;
        }
        .controls {
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
        }
        .controls label {
            color: #ffffff;
            font-weight: 500;
            font-size: 14px;
        }
        .controls select {
            background-color: #282828;
            color: #ffffff;
            border: 1px solid #404040;
            border-radius: 4px;
            padding: 8px 12px;
            font-size: 14px;
            cursor: pointer;
            outline: none;
            transition: border-color 0.2s;
        }
        .controls select:hover {
            border-color: #1DB954;
        }
        .controls select:focus {
            border-color: #1DB954;
        }
        canvas {
            max-width: 100%;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="controls">
            <label for="sortSelect">Sort by:</label>
            <select id="sortSelect">
                <option value="total-desc">Total Popularity (High to Low)</option>
                <option value="total-asc">Total Popularity (Low to High)</option>
                <option value="explicit-desc">Explicit Content (High to Low)</option>
                <option value="explicit-asc">Explicit Content (Low to High)</option>
                <option value="non-explicit-desc">Non-Explicit Content (High to Low)</option>
                <option value="non-explicit-asc">Non-Explicit Content (Low to High)</option>
                <option value="explicit-ratio-desc">Explicit Ratio (High to Low)</option>
                <option value="explicit-ratio-asc">Explicit Ratio (Low to High)</option>
                <option value="alpha-asc">Alphabetical (A to Z)</option>
                <option value="alpha-desc">Alphabetical (Z to A)</option>
                <option value="original">Original Order</option>
            </select>
        </div>
        <canvas id="popularityChart"></canvas>
    </div>

    <script>
        const ctx = document.getElementById('popularityChart').getContext('2d');
        
        // Original data from pandas DataFrame
        const artistsOriginal = ['Arctic Monkeys', 'BTS', 'Bryan Adams', 'Charlie Brown Jr.', 'Chuck Berry', 'Daddy Yankee', 'Ella Fitzgerald', 'Elvis Presley', 'Feid', 'George Jones', 'Håkan Hellström', 'Linkin Park', 'OneRepublic', 'Prateek Kuhad', 'Red Hot Chili Peppers', 'Scooter', 'Stevie Wonder', 'The Beach Boys', 'The Beatles', 'my little airport'];
        const explicitFalseOriginal = [55, 69, 11, 42, 8, 13, 1, 55, 10, 17, 31, 56, 31, 46, 42, 24, 1, 7, 61, 33];
        const explicitTrueOriginal = [60, 0, 0, 0, 0, 71, 0, 0, 12, 0, 32, 50, 20, 0, 36, 24, 0, 0, 0, 30];

        // Create initial combined data with original indices
        const originalData = artistsOriginal.map((artist, i) => ({
            artist: artist,
            explicitFalse: explicitFalseOriginal[i],
            explicitTrue: explicitTrueOriginal[i],
            total: explicitFalseOriginal[i] + explicitTrueOriginal[i],
            explicitRatio: explicitTrueOriginal[i] / (explicitFalseOriginal[i] + explicitTrueOriginal[i]) || 0,
            originalIndex: i
        }));

        // Two consistent green colors for explicit vs non-explicit - normal green like Elvis chart
        const NON_EXPLICIT_COLOR = '#4CBB17'; // Kelly Green for non-explicit
        const EXPLICIT_COLOR = '#2A9D6C'; // Jade Green for explicit

        function sortData(sortType) {
            let sorted = [...originalData];
            
            switch(sortType) {
                case 'total-desc':
                    sorted.sort((a, b) => b.total - a.total);
                    break;
                case 'total-asc':
                    sorted.sort((a, b) => a.total - b.total);
                    break;
                case 'explicit-desc':
                    sorted.sort((a, b) => b.explicitTrue - a.explicitTrue);
                    break;
                case 'explicit-asc':
                    sorted.sort((a, b) => a.explicitTrue - b.explicitTrue);
                    break;
                case 'non-explicit-desc':
                    sorted.sort((a, b) => b.explicitFalse - a.explicitFalse);
                    break;
                case 'non-explicit-asc':
                    sorted.sort((a, b) => a.explicitFalse - b.explicitFalse);
                    break;
                case 'explicit-ratio-desc':
                    sorted.sort((a, b) => b.explicitRatio - a.explicitRatio);
                    break;
                case 'explicit-ratio-asc':
                    sorted.sort((a, b) => a.explicitRatio - b.explicitRatio);
                    break;
                case 'alpha-asc':
                    sorted.sort((a, b) => a.artist.localeCompare(b.artist));
                    break;
                case 'alpha-desc':
                    sorted.sort((a, b) => b.artist.localeCompare(a.artist));
                    break;
                case 'original':
                    sorted.sort((a, b) => a.originalIndex - b.originalIndex);
                    break;
            }
            
            return sorted;
        }

        function updateChart(sortType) {
            const sorted = sortData(sortType);
            
            const artists = sorted.map(d => d.artist);
            const explicitFalse = sorted.map(d => d.explicitFalse);
            const explicitTrue = sorted.map(d => d.explicitTrue);
            const totals = sorted.map(d => d.total);
            
            // Use consistent colors for all bars
            const explicitFalseColors = new Array(artists.length).fill(NON_EXPLICIT_COLOR);
            const explicitTrueColors = new Array(artists.length).fill(EXPLICIT_COLOR);
            
            myChart.data.labels = artists;
            myChart.data.datasets[0].data = explicitFalse;
            myChart.data.datasets[0].backgroundColor = explicitFalseColors;
            myChart.data.datasets[0].borderColor = explicitFalseColors;
            myChart.data.datasets[1].data = explicitTrue;
            myChart.data.datasets[1].backgroundColor = explicitTrueColors;
            myChart.data.datasets[1].borderColor = explicitTrueColors;
            
            // Store totals for tooltip
            myChart.options.plugins.tooltip.callbacks.footer = function(tooltipItems) {
                const index = tooltipItems[0].dataIndex;
                return 'Total: ' + totals[index];
            };
            
            myChart.update();
        }

        // Initial sort
        let initialSorted = sortData('total-desc');
        let artists = initialSorted.map(d => d.artist);
        let explicitFalse = initialSorted.map(d => d.explicitFalse);
        let explicitTrue = initialSorted.map(d => d.explicitTrue);
        let totals = initialSorted.map(d => d.total);

        // Use consistent colors for all bars
        const explicitFalseColors = new Array(artists.length).fill(NON_EXPLICIT_COLOR);
        const explicitTrueColors = new Array(artists.length).fill(EXPLICIT_COLOR);

        const myChart = new Chart(ctx, {
            type: 'bar',
            data: {
                labels: artists,
                datasets: [
                    {
                        label: 'Non-Explicit',
                        data: explicitFalse,
                        backgroundColor: explicitFalseColors,
                        borderColor: explicitFalseColors,
                        borderWidth: 1
                    },
                    {
                        label: 'Explicit',
                        data: explicitTrue,
                        backgroundColor: explicitTrueColors,
                        borderColor: explicitTrueColors,
                        borderWidth: 1
                    }
                ]
            },
            options: {
                responsive: true,
                maintainAspectRatio: true,
                plugins: {
                    title: {
                        display: true,
                        text: 'Popularity by Artists (Top 20), Split by Explicit Content',
                        font: {
                            size: 18,
                            weight: '700'
                        },
                        color: '#ffffff',
                        padding: {
                            bottom: 20
                        }
                    },
                    legend: {
                        display: true,
                        position: 'top',
                        align: 'end',
                        title: {
                            display: true,
                            text: 'Content Type',
                            color: '#ffffff'
                        },
                        labels: {
                            color: '#ffffff',
                            generateLabels: function(chart) {
                                return [
                                    {
                                        text: 'Non-Explicit',
                                        fillStyle: NON_EXPLICIT_COLOR,
                                        strokeStyle: NON_EXPLICIT_COLOR,
                                        lineWidth: 1
                                    },
                                    {
                                        text: 'Explicit',
                                        fillStyle: EXPLICIT_COLOR,
                                        strokeStyle: EXPLICIT_COLOR,
                                        lineWidth: 1
                                    }
                                ];
                            }
                        }
                    },
                    tooltip: {
                        callbacks: {
                            footer: function(tooltipItems) {
                                const index = tooltipItems[0].dataIndex;
                                return 'Total: ' + totals[index];
                            }
                        }
                    }
                },
                scales: {
                    x: {
                        stacked: true,
                        title: {
                            display: true,
                            text: 'Artist',
                            color: '#ffffff'
                        },
                        ticks: {
                            maxRotation: 90,
                            minRotation: 90,
                            color: '#b3b3b3'
                        },
                        grid: {
                            color: '#282828'
                        }
                    },
                    y: {
                        stacked: true,
                        title: {
                            display: true,
                            text: 'Popularity Score',
                            color: '#ffffff'
                        },
                        beginAtZero: true,
                        ticks: {
                            color: '#b3b3b3'
                        },
                        grid: {
                            color: '#282828'
                        }
                    }
                }
            }
        });

        // Add event listener for sort selection
        document.getElementById('sortSelect').addEventListener('change', function(e) {
            updateChart(e.target.value);
        });
    </script>
</body>
</html>
