<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Elvis Presley Sound Comparison</title>
  <script src="https://cdn.jsdelivr.net/npm/vega@5"></script>
  <script src="https://cdn.jsdelivr.net/npm/vega-lite@5"></script>
  <script src="https://cdn.jsdelivr.net/npm/vega-embed@6"></script>
  <style>
    body {
      font-family: 'Circular', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      margin: 0;
      padding: 20px;
      background-color: #121212;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    #vis {
      background: #121212;
      padding: 20px;
      border-radius: 8px;
      display: inline-block;
    }
  </style>
</head>
<body>
  <div id="vis"></div>

  <script type="text/javascript">
    // Load and process data
    fetch('dataset.csv')
      .then(response => response.text())
      .then(csvText => {
        const rows = csvText.split('\n');
        const headers = rows[0].split(',');
        
        // Find column indices
        const artistsIndex = headers.indexOf('artists');
        const trackNameIndex = headers.indexOf('track_name');
        const albumNameIndex = headers.indexOf('album_name');
        const valenceIndex = headers.indexOf('valence');
        const acousticnessIndex = headers.indexOf('acousticness');
        const tempoIndex = headers.indexOf('tempo');
        const loudnessIndex = headers.indexOf('loudness');
        const durationMsIndex = headers.indexOf('duration_ms');

        // Filter for Elvis Presley and collect data
        const elvisData = [];

        for (let i = 1; i < rows.length; i++) {
          if (!rows[i].trim()) continue;
          const cols = rows[i].split(',');
          const artists = cols[artistsIndex];
          
          if (artists && artists.toLowerCase().includes('elvis presley')) {
            const durationMs = parseFloat(cols[durationMsIndex]);
            const loudness = parseFloat(cols[loudnessIndex]);
            const valence = parseFloat(cols[valenceIndex]);
            const acousticness = parseFloat(cols[acousticnessIndex]);
            const tempo = parseFloat(cols[tempoIndex]);

            if (!isNaN(durationMs) && !isNaN(loudness)) {
              elvisData.push({
                track_name: cols[trackNameIndex],
                album_name: cols[albumNameIndex],
                valence: valence,
                acousticness: acousticness,
                tempo: tempo,
                loudness: loudness,
                duration_min: durationMs / 60000
              });
            }
          }
        }

        // Create Vega-Lite specification
        const spec = {
          "$schema": "https://vega.github.io/schema/vega-lite/v5.json",
          "background": "#121212",
          "data": {"values": elvisData},
          "vconcat": [
            {
              "title": {
                "text": "Elvis Presley Songs: Valence vs. Acousticness (Click to Reveal Song)",
                "color": "#ffffff",
                "fontSize": 16,
                "font": "Circular, -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif"
              },
              "width": 600,
              "height": 400,
              "layer": [
                {
                  "params": [{
                    "name": "click",
                    "select": {"type": "point", "on": "click", "fields": ["track_name"], "clear": "dblclick"}
                  }],
                  "mark": {"type": "circle", "size": 90, "opacity": 0.7},
                  "encoding": {
                    "x": {
                      "field": "acousticness",
                      "type": "quantitative",
                      "title": "Acousticness (Instrumental Quality)",
                      "axis": {
                        "titleColor": "#ffffff",
                        "labelColor": "#b3b3b3",
                        "gridColor": "#282828",
                        "domainColor": "#282828"
                      }
                    },
                    "y": {
                      "field": "valence",
                      "type": "quantitative",
                      "title": "Valence (Happiness)",
                      "axis": {
                        "titleColor": "#ffffff",
                        "labelColor": "#b3b3b3",
                        "gridColor": "#282828",
                        "domainColor": "#282828"
                      }
                    },
                    "color": {
                      "condition": {
                        "param": "click",
                        "value": "#90EE90"
                      },
                      "field": "tempo",
                      "type": "quantitative",
                      "scale": {
                        "range": ["#064635", "#1B7357", "#2A9D6C", "#4CBB17", "#90EE90"]
                      },
                      "legend": {
                        "title": "Tempo",
                        "titleColor": "#ffffff",
                        "labelColor": "#ffffff"
                      }
                    },
                    "tooltip": [
                      {"field": "track_name", "type": "nominal", "title": "Track Name"},
                      {"field": "album_name", "type": "nominal", "title": "Album"},
                      {"field": "tempo", "type": "quantitative", "title": "Tempo"},
                      {"field": "loudness", "type": "quantitative", "title": "Loudness"},
                      {"field": "duration_min", "type": "quantitative", "title": "Duration (min)", "format": ".2f"}
                    ]
                  }
                },
                {
                  "transform": [{"filter": {"param": "click"}}],
                  "mark": {
                    "type": "text",
                    "align": "left",
                    "dx": 10,
                    "dy": -10,
                    "color": "#ffffff",
                    "fontSize": 13,
                    "fontWeight": "bold"
                  },
                  "encoding": {
                    "x": {"field": "acousticness", "type": "quantitative"},
                    "y": {"field": "valence", "type": "quantitative"},
                    "text": {"field": "track_name", "type": "nominal"}
                  }
                }
              ]
            },
            {
              "title": {
                "text": "Distribution of Elvis Presley Song Tempos",
                "color": "#ffffff",
                "fontSize": 16,
                "font": "Circular, -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif"
              },
              "width": 600,
              "height": 300,
              "mark": {"type": "bar", "opacity": 0.8, "color": "#2A9D6C"},
              "encoding": {
                "x": {
                  "field": "tempo",
                  "type": "quantitative",
                  "bin": {"maxbins": 25},
                  "title": "Tempo (BPM)",
                  "axis": {
                    "titleColor": "#ffffff",
                    "labelColor": "#b3b3b3",
                    "gridColor": "#282828",
                    "domainColor": "#282828"
                  }
                },
                "y": {
                  "aggregate": "count",
                  "title": "Number of Songs",
                  "axis": {
                    "titleColor": "#ffffff",
                    "labelColor": "#b3b3b3",
                    "gridColor": "#282828",
                    "domainColor": "#282828"
                  }
                }
              }
            },
            {
              "title": {
                "text": "Loudness vs Duration (Click a Song)",
                "color": "#ffffff",
                "fontSize": 16,
                "font": "Circular, -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif"
              },
              "width": 600,
              "height": 400,
              "layer": [
                {
                  "params": [{
                    "name": "click2",
                    "select": {"type": "point", "on": "click", "fields": ["track_name"], "clear": "dblclick"}
                  }],
                  "mark": {"type": "circle", "size": 90, "opacity": 0.7, "color": "#4CBB17"},
                  "encoding": {
                    "x": {
                      "field": "duration_min",
                      "type": "quantitative",
                      "title": "Song Duration (minutes)",
                      "axis": {
                        "titleColor": "#ffffff",
                        "labelColor": "#b3b3b3",
                        "gridColor": "#282828",
                        "domainColor": "#282828"
                      }
                    },
                    "y": {
                      "field": "loudness",
                      "type": "quantitative",
                      "title": "Loudness (dB)",
                      "axis": {
                        "titleColor": "#ffffff",
                        "labelColor": "#b3b3b3",
                        "gridColor": "#282828",
                        "domainColor": "#282828"
                      }
                    },
                    "tooltip": [
                      {"field": "track_name", "type": "nominal", "title": "Track Name"},
                      {"field": "album_name", "type": "nominal", "title": "Album"},
                      {"field": "tempo", "type": "quantitative", "title": "Tempo"},
                      {"field": "valence", "type": "quantitative", "title": "Valence"}
                    ]
                  }
                },
                {
                  "transform": [{"filter": {"param": "click2"}}],
                  "mark": {
                    "type": "text",
                    "align": "left",
                    "dx": 10,
                    "dy": -10,
                    "color": "#ffffff",
                    "fontSize": 13,
                    "fontWeight": "bold"
                  },
                  "encoding": {
                    "x": {"field": "duration_min", "type": "quantitative"},
                    "y": {"field": "loudness", "type": "quantitative"},
                    "text": {"field": "track_name", "type": "nominal"}
                  }
                }
              ]
            }
          ],
          "config": {
            "background": "#121212",
            "view": {
              "stroke": "transparent",
              "fill": "#121212"
            },
            "axis": {
              "grid": true,
              "gridColor": "#282828"
            },
            "legend": {
              "fillColor": "#121212",
              "strokeColor": "transparent",
              "titleColor": "#ffffff",
              "labelColor": "#ffffff"
            }
          }
        };

        vegaEmbed('#vis', spec, {
          actions: false,
          renderer: 'canvas'
        });
      })
      .catch(error => {
        console.error('Error loading data:', error);
        document.getElementById('vis').innerHTML = '<p style="color: #ffffff;">Error loading dataset.csv</p>';
      });
  </script>
</body>
</html>
