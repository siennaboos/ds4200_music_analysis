<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Music Genre Analysis</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
  <style>
      body {
          font-family: Arial, sans-serif;
          margin: 20px;
      }
      #controls {
          margin-bottom: 20px;
      }
      select {
          padding: 8px;
          font-size: 16px;
          border-radius: 4px;
          border: 1px solid #ccc;
      }
      label {
          font-weight: bold;
          margin-right: 10px;
      }
  </style>
</head>
<body>
<div id="controls">
  <label for="genreSelect">Select Genre Category:</label>
  <select id="genreSelect"></select>
</div>
<div id="chart"></div>

<script>
  const genre_dict = {
    'Rock & Alternative': [
      'alt-rock', 'alternative', 'grunge', 'hard-rock', 'indie',
      'psych-rock', 'punk-rock', 'punk', 'rock', 'rock-n-roll',
      'guitar', 'goth', 'emo', 'garage', 'industrial', 'grindcore',
      'hardcore'
    ],
    'Metal': [
      'black-metal', 'death-metal', 'heavy-metal', 'metal',
      'metalcore', 'power-pop'
    ],
    'Electronic & Dance': [
      'breakbeat', 'chicago-house', 'club', 'dance', 'deep-house',
      'detroit-techno', 'disco', 'drum-and-bass', 'dubstep', 'edm',
      'electro', 'electronic', 'hardstyle', 'house', 'idm',
      'minimal-techno', 'progressive-house', 'techno', 'trance',
      'synth-pop', 'groove'
    ],
    'Hip-Hop & Urban': [
      'hip-hop', 'r-n-b', 'soul', 'funk', 'dub', 'trip-hop'
    ],
    'Pop': [
      'pop', 'indie-pop', 'pop-film', 'party'
    ],
    'Country & Folk Americana': [
      'country', 'folk', 'bluegrass', 'honky-tonk',
      'singer-songwriter', 'songwriter', 'acoustic'
    ],
    'Jazz & Blues': [
      'jazz', 'blues', 'gospel'
    ],
    'Latin & Caribbean': [
      'latin', 'latino', 'reggae', 'reggaeton', 'dancehall',
      'salsa', 'samba', 'tango', 'brazil', 'forro', 'pagode'
    ],
    'Brazilian': [
      'mpb', 'sertanejo'
    ],
    'Asian Pop & Regional': [
      'j-pop', 'j-rock', 'j-dance', 'j-idol', 'k-pop',
      'cantopop', 'mandopop', 'indian', 'malay'
    ],
    'European & Regional': [
      'french', 'german', 'british', 'swedish', 'turkish',
      'iranian', 'spanish'
    ],
    'Classical & Sophisticated': [
      'classical', 'opera', 'new-age', 'piano'
    ],
    'Mood & Ambient': [
      'ambient', 'chill', 'happy', 'sad', 'sleep', 'study'
    ],
    'World & Traditional': [
      'world-music', 'afrobeat', 'ska'
    ],
    'Specialty & Novelty': [
      'anime', 'children', 'kids', 'comedy', 'disney',
      'show-tunes', 'romance', 'rockabilly'
    ]
  };

  let allData;
  const select = document.getElementById('genreSelect');

  Object.keys(genre_dict).forEach(genre => {
    const option = document.createElement('option');
    option.value = genre;
    option.textContent = genre;
    select.appendChild(option);
  });

  select.value = 'Hip-Hop & Urban';

  d3.csv("dataset.csv").then(function(data) {
    allData = data;
    allData.forEach(function(d) {
      d.duration = (+d.duration_ms / 1000) / 60;
      d.popularity = +d.popularity;
    });

    updateChart('Hip-Hop & Urban');
  });

  select.addEventListener('change', function() {
    updateChart(this.value);
  });

  function updateChart(selectedGenre) {
    d3.select('#chart').selectAll('*').remove();

    const genreList = genre_dict[selectedGenre];
    const filteredData = allData.filter(d => genreList.includes(d.track_genre));

    if (filteredData.length === 0) {
      d3.select('#chart').append('p')
        .text('No data available for this genre category');
      return;
    }

    const width = 800;
    const height = 600;
    const margin = { top: 50, bottom: 50, left: 50, right: 50 };

    const svg = d3.select('#chart')
      .append('svg')
      .attr('width', width)
      .attr('height', height)
      .style('background', 'white');

    const xScale = d3.scaleLinear()
      .domain([0, d3.max(filteredData, d => d.duration) * 1.1])
      .range([margin.left, width - margin.right]);

    const yScale = d3.scaleLinear()
      .domain([0, d3.max(filteredData, d => d.popularity) * 1.1])
      .range([height - margin.bottom, margin.top]);

    svg.append('g')
      .call(d3.axisBottom().scale(xScale))
      .attr('transform', `translate(0, ${height - margin.bottom})`);

    svg.append('g')
      .call(d3.axisLeft().scale(yScale))
      .attr('transform', `translate(${margin.left}, 0)`);

    svg.append('text')
      .attr('x', width / 2)
      .attr('y', height - 15)
      .text('Duration (minutes)')
      .style('text-anchor', 'middle');

    svg.append('text')
      .attr('x', 0 - height / 2)
      .attr('y', 15)
      .text('Popularity')
      .style('text-anchor', 'middle')
      .attr('transform', 'rotate(-90)');

    svg.append('text')
      .attr('x', width / 2)
      .attr('y', 30)
      .text(`Duration vs. Popularity: ${selectedGenre}`)
      .style('text-anchor', 'middle')
      .style('font-size', '20px')
      .style('font-weight', 'bold');

    svg.append('g')
      .selectAll("circle")
      .data(filteredData)
      .enter()
      .append("circle")
      .attr("cx", d => xScale(d.duration))
      .attr("cy", d => yScale(d.popularity))
      .attr("r", 2)
      .style("fill", "#69b3a2")
      .style("fill-opacity", 0.6)
      .style('outline', .2);

    function linearRegression(data) {
      const n = data.length;
      let sumX = 0, sumY = 0, sumXY = 0, sumX2 = 0;

      data.forEach(d => {
        sumX += d.duration;
        sumY += d.popularity;
        sumXY += d.duration * d.popularity;
        sumX2 += d.duration * d.duration;
      });

      const slope = (n * sumXY - sumX * sumY) / (n * sumX2 - sumX * sumX);
      const intercept = (sumY - slope * sumX) / n;

      return { slope, intercept };
    }

    const regression = linearRegression(filteredData);
    const xMin = 0;
    const xMax = d3.max(filteredData, d => d.duration);
    const lineData = [
      { duration: xMin, popularity: regression.slope * xMin + regression.intercept },
      { duration: xMax, popularity: regression.slope * xMax + regression.intercept }
    ];

    const getLine = d3.line()
      .x(d => xScale(d.duration))
      .y(d => yScale(d.popularity));

    svg.append("path")
      .attr("d", getLine(lineData))
      .attr("fill", "none")
      .attr("stroke", "#3a917d")
      .attr("stroke-width", 1)
      .attr("opacity", 0.7);

    svg.append("text")
      .attr("x", width - margin.right - 10)
      .attr("y", margin.top + 20)
      .attr("text-anchor", "end")
      .text(`Line of Best Fit: y = ${regression.slope.toFixed(2)}x + ${regression.intercept.toFixed(2)}`)
      .style("fill", "black")
      .style("font-size", "14px");
  }
</script>
</body>
</html>
