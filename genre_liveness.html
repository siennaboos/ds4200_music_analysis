<!-- Add these script tags to <head> section (if not in starter code from prof yang) -->
<script src="https://cdn.jsdelivr.net/npm/vega@5"></script>
<script src="https://cdn.jsdelivr.net/npm/vega-lite@5"></script>
<script src="https://cdn.jsdelivr.net/npm/vega-embed@6"></script>

<!-- Add this div where you want the chart to appear -->
<div id="genre-liveness-chart"></div>

<!-- Add this script at the bottom of your page or in a <script> tag -->
<script type="text/javascript">
    const chartData = [
        {"genre_category":"Brazilian","liveness":0.40684415},
        {"genre_category":"Latin & Caribbean","liveness":0.2574202909},
        {"genre_category":"Specialty & Novelty","liveness":0.2545072375},
        {"genre_category":"Metal","liveness":0.2417994667},
        {"genre_category":"World & Traditional","liveness":0.2354663},
        {"genre_category":"Jazz & Blues","liveness":0.2201746},
        {"genre_category":"Mood & Ambient","liveness":0.21204415},
        {"genre_category":"Rock & Alternative","liveness":0.2115458647},
        {"genre_category":"Hip-Hop & Urban","liveness":0.1995304667},
        {"genre_category":"Pop","liveness":0.1949526375},
        {"genre_category":"Electronic & Dance","liveness":0.1905845029},
        {"genre_category":"European & Regional","liveness":0.1902935714},
        {"genre_category":"Asian Pop & Regional","liveness":0.1898864222},
        {"genre_category":"Classical & Sophisticated","liveness":0.18300595},
        {"genre_category":"Country & Folk Americana","liveness":0.1750093286}
    ];

    const spec = {
        "$schema": "https://vega.github.io/schema/vega-lite/v5.json",
        "data": {"values": chartData},
        "width": 800,
        "height": 500,
        "title": "Average Liveness by Genre Category (Click to Highlight)",
        "params": [{
            "name": "select",
            "select": {"type": "point", "fields": ["genre_category"]}
        }],
        "mark": {"type": "bar"},
        "encoding": {
            "x": {
                "field": "liveness",
                "type": "quantitative",
                "title": "Average Liveness Score",
                "scale": {"domain": [0, 0.45]}
            },
            "y": {
                "field": "genre_category",
                "type": "nominal",
                "title": "Genre Category",
                "sort": "-x"
            },
            "color": {
                "condition": {
                    "param": "select",
                    "field": "liveness",
                    "type": "quantitative",
                    "scale": {"scheme": "viridis"},
                    "legend": {"title": "Liveness"}
                },
                "value": "lightgray"
            },
            "opacity": {
                "condition": {"param": "select", "value": 1},
                "value": 0.3
            },
            "tooltip": [
                {"field": "genre_category", "type": "nominal", "title": "Genre Category"},
                {"field": "liveness", "type": "quantitative", "title": "Average Liveness", "format": ".4f"}
            ]
        }
    };

    vegaEmbed('#genre-liveness-chart', spec, {
        actions: {
            export: true,
            source: false,
            compiled: false,
            editor: false
        }
    });
</script>
